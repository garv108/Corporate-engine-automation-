services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cias
      POSTGRES_PASSWORD: cias_dev_password
      POSTGRES_DB: cias
    ports:
      - "5432:5432"
    volumes:
      - cias-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cias -d cias"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: cias-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cias-redis-data:/data
volumes:
  cias-postgres-data:
  cias-redis-data:
